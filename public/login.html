<!DOCTYPE html>
<html lang="ar" dir="rtl" data-i18n-title="pageLoginTitle">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicktopya | تسجيل الدخول</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#dc2626',
                            hover: '#b91c1c',
                            dark: '#991b1b',
                            light: '#fef2f2'
                        }
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="font-sans bg-slate-100 flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav id="siteNavbar" class="navbar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-4">
            <a href="/" class="flex items-center gap-2.5 shrink-0 group focus:outline-none">
                <img src="/logo.png" alt="Clicktopya" class="logo-img h-10 w-10 object-contain rounded-xl shadow-sm transition-transform duration-200 group-hover:scale-105" onerror="handleLogoError(this)">
                <span class="logo-fallback font-black text-2xl tracking-tight text-white">Clicktopya</span>
                <span class="logo-text font-black text-2xl tracking-tight text-white drop-shadow-sm">Clicktopya</span>
            </a>

            <div class="hidden md:flex items-center gap-6 text-sm font-semibold text-white/90">
                <a href="/" class="hover:text-white hover:border-b-2 hover:border-white/70 transition duration-150 py-1" data-i18n="home">الرئيسية</a>
                <a href="/products" class="hover:text-white hover:border-b-2 hover:border-white/70 transition duration-150 py-1" data-i18n="products">المنتجات</a>
                <a href="/categories" class="hover:text-white hover:border-b-2 hover:border-white/70 transition duration-150 py-1" data-i18n="categories">التصنيفات</a>
                <a href="/cart" class="hover:text-white transition duration-150 py-1 flex items-center">
                    <i class="fas fa-shopping-cart text-base me-1.5"></i>
                    <span data-i18n="cart">عربة التسوق</span>
                </a>
            </div>

            <div class="flex items-center gap-3">
                <div class="flex items-center bg-white/15 p-0.5 rounded-full border border-white/20 text-xs font-bold text-white shadow-inner">
                    <button type="button" class="lang-btn px-2.5 py-1 rounded-full" data-lang="ar" onclick="setLanguage('ar')">عربي</button>
                    <button type="button" class="lang-btn px-2.5 py-1 rounded-full" data-lang="en" onclick="setLanguage('en')">EN</button>
                </div>

                <!-- Dedicated Top Bar Cart Icon (Desktop & Mobile) -->
                <a href="/cart" class="nav-cart-btn" aria-label="Shopping Cart" title="عربة التسوق">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="nav-cart-counter cart-badge-counter">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Section -->
    <main class="flex-grow flex items-center justify-center px-4 pt-28 pb-16 bg-gradient-to-br from-red-600 via-rose-600 to-red-800">
        <div class="bg-white rounded-3xl p-8 sm:p-10 w-full max-w-md shadow-2xl border border-white/20 relative">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-sm">
                    <i class="fas fa-sign-in-alt"></i>
                </div>
                <h1 class="text-2xl sm:text-3xl font-black text-slate-900" data-i18n="loginTitle">تسجيل الدخول</h1>
                <p class="text-slate-500 text-xs sm:text-sm mt-1">سجل دخولك لمتابعة طلباتك المسجلة</p>
            </div>

            <form onsubmit="event.preventDefault(); login();" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1" for="loginEmail" data-i18n="email">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" required class="w-full border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition bg-slate-50 focus:bg-white" data-i18n-placeholder="email" placeholder="example@mail.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1" for="loginPassword" data-i18n="password">كلمة المرور</label>
                    <input type="password" id="loginPassword" required class="w-full border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition bg-slate-50 focus:bg-white" data-i18n-placeholder="password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-hover w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-full font-extrabold text-base shadow-lg shadow-red-600/30 transition mt-2" data-i18n="login">
                    دخول
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
                <span data-i18n="noAccount">ليس لديك حساب؟</span>
                <a href="/register" class="text-red-600 font-extrabold hover:underline ms-1" data-i18n="createAccount">إنشاء حساب جديد</a>
            </div>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
